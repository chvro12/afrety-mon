name: refresh
# commit mensuel -> évite que GitHub désactive les workflows planifiés (60j sans activité)
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .refresh
      - name: commit
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .refresh
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh [skip ci]"
          git push
