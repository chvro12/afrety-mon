name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake Render
        run: |
          curl -sS -m 60 https://afrety-mon.onrender.com/health || true
          sleep 5
          curl -sS -m 60 https://afrety-mon.onrender.com/health || true
